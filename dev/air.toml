# Run from the repository root: go run github.com/air-verse/air@v1.67.4 -c dev/air.toml
root = "backend"
tmp_dir = "../dev/.runtime/air"
env_files = []

[build]
cmd = "go build -o ../dev/.runtime/air/server ./cmd/server"
entrypoint = ["../dev/.runtime/air/server"]
include_ext = ["go", "sql", "tpl", "tmpl", "html"]
include_file = ["go.mod", "go.sum"]
exclude_dir = ["bin", "data", "internal/web/dist", "vendor"]
exclude_regex = ["_test\\.go"]
exclude_unchanged = true
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = "5s"

[build.windows]
cmd = "go build -o ../dev/.runtime/air/server.exe ./cmd/server"
entrypoint = ["../dev/.runtime/air/server.exe"]

[misc]
clean_on_exit = false

[screen]
clear_on_rebuild = false

[proxy]
enabled = false
