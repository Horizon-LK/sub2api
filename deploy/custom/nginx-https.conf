# Install inside Nginx's http context (e.g. sites-available + sites-enabled).
map $http_upgrade $sub2api_connection_upgrade {
    default upgrade;
    '' close;
}

# Match the method and normalized URI; query strings do not bypass this check.
map "$request_method:$uri" $sub2api_block_inplace_update {
    default 0;
    "POST:/api/v1/admin/system/update" 1;
    "POST:/api/v1/admin/system/update/" 1;
    "POST:/api/v1/admin/system/rollback" 1;
    "POST:/api/v1/admin/system/rollback/" 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name h6k.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://h6k.top$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name h6k.top;

    ssl_certificate /etc/letsencrypt/live/h6k.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/h6k.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:Sub2APITLS:10m;
    ssl_session_timeout 1d;

    client_max_body_size 256m;
    client_body_timeout 3600s;
    send_timeout 3600s;

    # A return-only rewrite if safely blocks the two mutating upstream routes.
    if ($sub2api_block_inplace_update) {
        return 403;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host h6k.top;
        proxy_set_header X-Real-IP $remote_addr;
        # Direct DNS -> Nginx: overwrite client-supplied forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host h6k.top;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $sub2api_connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
    }
}
