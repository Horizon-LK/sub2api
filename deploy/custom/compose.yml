name: sub2api-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  sub2api:
    image: ghcr.io/horizon-lk/sub2api@sha256:866c6a89500c667971d8314595101107e1467fe5e2e77e928419039d6b89dbca
    platform: linux/amd64
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /opt/sub2api/data:/app/data
    environment:
      AUTO_SETUP: "true"
      DATA_DIR: /app/data
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      SERVER_MODE: release
      SERVER_FRONTEND_URL: https://h6k.top
      SERVER_TRUSTED_PROXIES: ${TRUSTED_PROXY_CIDR:?Set the Docker bridge gateway /32}
      SECURITY_TRUST_FORWARDED_IP_FOR_API_KEY_ACL: "false"
      CORS_ALLOWED_ORIGINS: https://h6k.top
      RUN_MODE: standard
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: sub2api
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATABASE_DBNAME: sub2api
      DATABASE_SSLMODE: disable
      DATABASE_MAX_OPEN_CONNS: "50"
      DATABASE_MAX_IDLE_CONNS: "10"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: "0"
      REDIS_POOL_SIZE: "128"
      REDIS_MIN_IDLE_CONNS: "10"
      ADMIN_EMAIL: admin@h6k.top
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY is required}
      SETUP_MIGRATION_TIMEOUT_SECONDS: "300"
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    networks:
      - backend
    logging: *logging

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    restart: unless-stopped
    shm_size: 128mb
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=128MB
    environment:
      POSTGRES_USER: sub2api
      POSTGRES_DB: sub2api
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: Asia/Shanghai
    volumes:
      # PG18 defaults to /var/lib/postgresql/18/docker inside this mounted parent.
      - /opt/sub2api/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sub2api -d sub2api && psql -U sub2api -d sub2api -Atqc 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    networks:
      - backend
    logging: *logging

  redis:
    image: ${REDIS_IMAGE:-redis:8-alpine}
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - "60"
      - "1"
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      TZ: Asia/Shanghai
    volumes:
      - /opt/sub2api/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - backend
    logging: *logging

networks:
  backend:
    name: sub2api-prod-backend
    external: true
