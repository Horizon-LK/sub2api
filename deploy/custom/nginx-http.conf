# Initial certificate issuance only; replace with nginx-https.conf after issuance.
server {
    listen 80;
    listen [::]:80;
    server_name h6k.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
